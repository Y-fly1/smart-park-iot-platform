# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.0
  # 版权年份
  copyrightYear: 2025
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 激活环境
spring:
  profiles:
    active: dev

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥（生产环境务必通过环境变量覆盖）
  secret: ${TOKEN_SECRET:abcdefghijklmnopqrstuvwxyz}
  # 令牌有效期（默认30分钟）
  expireTime: 300000

# 微信小程序配置（请在本地环境变量中配置，勿提交真实密钥）
wx:
  miniapp:
    # 小程序appid
    appid: ${WX_MINIAPP_APPID:}
    # 小程序appsecret
    secret: ${WX_MINIAPP_SECRET:}
# MyBatisPlus配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.zhiwei.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 全局配置
  global-config:
    db-config:
      id-type: auto   #id生成策略为自增
  configuration:
    map-underscore-to-camel-case: true    #字段与属性，自动转换为驼峰命名

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# Dify 智能体配置
dify:
  # Dify 服务地址（包含版本号 /v1）
  base-url: ${DIFY_BASE_URL:http://localhost/v1}
  # Dify 应用密钥（从 Dify 控制台获取后配置到环境变量）
  api-key: ${DIFY_API_KEY:}
  # 连接超时时间（秒）
  connect-timeout: 10
  # 请求超时时间（秒），流式对话建议设置较大值
  read-timeout: 300
  # 未登录时的默认用户标识
  default-user: zhiwei-anonymous
